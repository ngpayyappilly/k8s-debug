name: PR checks

on:
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - bashrc
      - motd.txt
      - scripts/**
      - .hadolint.yaml
      - .trivyignore
      - .github/workflows/**

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml

      - name: ShellCheck
        run: shellcheck scripts/*.sh

      - name: Actionlint
        uses: raven-actions/actionlint@v2

  build-and-test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm # native runner, no QEMU emulation
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: k8s-debug:pr
          cache-from: type=gha,scope=pr-${{ matrix.arch }}
          cache-to: type=gha,scope=pr-${{ matrix.arch }},mode=max

      - name: Smoke test
        run: scripts/smoke-test.sh k8s-debug:pr

      # Vulnerability scan (the vulnerability DB is arch independent, so one
      # arch is enough). Report everything fixable at HIGH+, but only block the
      # PR on fixable CRITICAL so an upstream HIGH disclosure cannot wedge
      # unrelated PRs. Add justified exceptions to .trivyignore.
      - name: Trivy report (HIGH+, fixable)
        if: matrix.arch == 'amd64'
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: k8s-debug:pr
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          trivyignores: .trivyignore

      - name: Trivy gate (CRITICAL, fixable)
        if: matrix.arch == 'amd64'
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: k8s-debug:pr
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
